name: Execute reviewed Beta operation
description: Prove the travelled release bytes, then execute the operation under a restricted OIDC session
inputs:
  verify_artifact:
    default: 'true'
    description: Prove the verify job's release bytes before any credential; false only for a read-only state run with no separate verify job
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: npm ci
      shell: bash
    # The pre-credential byte and identity proof (#207). It re-derives this
    # dispatch from its own inputs, requires the verify job's `release_assets`
    # output to be exactly the operation's consumed asset set, hashes each
    # travelled file once against the published digest and strictly loads the
    # schema asset or runtime policy. It runs before any step that can request an
    # OIDC token, so no credential exists while the bytes are unproven.
    - name: Prove the travelled release bytes against the published digests before any credential
      if: inputs.verify_artifact == 'true'
      shell: bash
      run: node scripts/prove-release-bytes.mjs
    # A job that has no verify job of its own (read-only `state`) still validates
    # the operation and its reviewed context before any credential.
    - name: Validate operation inputs before any credential
      if: inputs.verify_artifact == 'false'
      shell: bash
      run: node scripts/check-operation.mjs
    # This is the first step that can request an OIDC token. There is no step after
    # it that writes a record: the operation's own job conclusion and the platform
    # facts are the evidence.
    - name: Execute the operation with restricted OIDC sessions
      id: operation
      shell: bash
      run: node scripts/runtime-operation.mjs
