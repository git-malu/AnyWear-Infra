name: Verify reviewed Beta operation inputs
description: Verify the reviewed Service release identity before any job obtains AWS credentials
inputs:
  app_private_key:
    required: true
    description: Protected read-only Service App key
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: npm ci
      shell: bash
    - name: Validate operation family and reviewed Service release identity before credentials
      shell: bash
      run: |
        mkdir -p deployment-evidence
        node scripts/check-operation.mjs
    - name: Create the read-only Service release token when this operation takes a release
      id: app
      if: env.INFRA_OPERATION == 'deploy-platform' || env.INFRA_OPERATION == 'restore-release'
      uses: actions/create-github-app-token@v3
      with:
        app-id: 3346940
        private-key: ${{ inputs.app_private_key }}
        owner: git-malu
        repositories: AnyWear-Service
        permission-contents: read
    - name: Download and prove the sealed Service release assets
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
      run: node scripts/verify-operation-inputs.mjs
    - name: Preserve the verified inputs and the sealed release directory
      uses: actions/upload-artifact@v4
      with:
        name: infra-verified-inputs-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          deployment-evidence/verified-inputs.json
          .service-artifacts/selected
        retention-days: 90
        if-no-files-found: warn
