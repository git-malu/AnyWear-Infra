name: Reviewed Beta infrastructure operation
run-name: Beta ${{ inputs.operation }} · ${{ inputs.writer_window }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [deploy-foundation, deploy-billing, deploy-platform, deploy-workload, migrate, verify, start, stop, observe, tester-status, tester-add, tester-replace]
        required: true
      writer_window:
        type: string
        required: true
      selection_file:
        description: Reviewed canonical selector path in this Infra revision
        type: string
        required: true
      selection_sha256:
        type: string
        required: true
      identity_phase:
        type: choice
        options: [legacy, roles-added, retired]
        default: legacy
        required: true
      retention_protection:
        type: boolean
        default: false
      stack_sources_file:
        description: Reviewed per-stack producer source JSON path
        type: string
        required: true
      tester_emails:
        description: Exact email JSON array; bound to the manager window after normalization
        type: string
        default: '[]'
permissions:
  contents: read
concurrency:
  group: anywear-beta-infra-runtime
  cancel-in-progress: false
jobs:
  operation:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_BETA_DEPLOY == 'true'
    environment: beta
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      BILLING_REGION: us-east-1
      ENABLE_BETA_DEPLOY: ${{ vars.ENABLE_BETA_DEPLOY }}
      INFRA_OPERATION: ${{ inputs.operation }}
      WRITER_WINDOW_INPUT: ${{ inputs.writer_window }}
      INFRA_WRITER_WINDOW: ${{ vars.INFRA_WRITER_WINDOW }}
      INFRA_WINDOW_SHA: ${{ vars.INFRA_WINDOW_SHA }}
      INFRA_WINDOW_EXPIRES_AT: ${{ vars.INFRA_WINDOW_EXPIRES_AT }}
      INFRA_WINDOW_RECORD_URL: ${{ vars.INFRA_WINDOW_RECORD_URL }}
      INFRA_WINDOW_OPERATION: ${{ vars.INFRA_WINDOW_OPERATION }}
      INFRA_WINDOW_TESTERS_SHA256: ${{ vars.INFRA_WINDOW_TESTERS_SHA256 }}
      TESTER_EMAILS: ${{ inputs.tester_emails }}
      INFRA_WINDOW_SELECTION_SHA256: ${{ vars.INFRA_WINDOW_SELECTION_SHA256 }}
      INFRA_IDENTITY_PHASE: ${{ vars.INFRA_IDENTITY_PHASE }}
      IDENTITY_PHASE_INPUT: ${{ inputs.identity_phase }}
      RETENTION_PROTECTION_INPUT: ${{ inputs.retention_protection }}
      INFRA_RETENTION_PROTECTION: ${{ vars.INFRA_RETENTION_PROTECTION }}
      INFRA_DEPLOY_ROLE_ARN: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
      INFRA_RUNTIME_ROLE_ARN: ${{ vars.INFRA_RUNTIME_ROLE_ARN }}
      SELECTION_FILE: ${{ inputs.selection_file }}
      SELECTION_SHA256: ${{ inputs.selection_sha256 }}
      STACK_SOURCES_FILE: ${{ inputs.stack_sources_file }}
      STACK_SOURCES_SHA256: ${{ vars.INFRA_WINDOW_STACK_SOURCES_SHA256 }}
      OBSERVATION_WRITER_WINDOW: ${{ inputs.writer_window }}
      OBSERVATION_WINDOW_SHA: ${{ vars.INFRA_WINDOW_SHA }}
      OBSERVATION_WINDOW_EXPIRES_AT: ${{ vars.INFRA_WINDOW_EXPIRES_AT }}
      OBSERVATION_WINDOW_RECORD_URL: ${{ vars.INFRA_WINDOW_RECORD_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Validate exact source, stack provenance and manager window before credentials
        run: |
          mkdir -p deployment-evidence
          node scripts/check-window.mjs
          node scripts/check-stack-sources.mjs
      - name: Create read-only private artifact token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: 3346940
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: git-malu
          repositories: AnyWear-Service
          permission-contents: read
          permission-actions: read
      - name: Execute selected operation with distinct OIDC principals
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/runtime-operation.mjs
      - name: Configure observation role
        if: inputs.operation != 'stop'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.INFRA_RUNTIME_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Observe final authenticated deployment
        if: inputs.operation != 'stop'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          node scripts/check-window.mjs
          node scripts/observe-deployment.mjs --selection "$SELECTION_FILE" --stack-sources deployment-evidence/stack-sources.json --output deployment-evidence/deployment-record.json --trusted-infra-root "$GITHUB_WORKSPACE" --infra-sha "$GITHUB_SHA"
      - name: Preserve exact final deployment record
        if: inputs.operation != 'stop'
        uses: actions/upload-artifact@v4
        with:
          name: infra-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-evidence/deployment-record.json
          retention-days: 90
          if-no-files-found: error
      - name: Preserve operation and automatic recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infra-operation-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-evidence/operation-record.json
          retention-days: 90
          if-no-files-found: warn
