name: Beta state
run-name: Beta ${{ inputs.operation }} at ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [state]
        required: true
permissions:
  contents: read
concurrency:
  group: anywear-infra-runtime
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Single-account constants, not environment configuration: `vars` resolves at
  # repository scope here, and the credential-free `preflight` job has no
  # `environment:` to resolve environment-scoped variables from. The scripts and
  # validators already hard-code the same account and region.
  AWS_ACCOUNT_ID: '650880818323'
  AWS_REGION: 'ap-east-1'
  CDK_DEFAULT_ACCOUNT: '650880818323'
  CDK_DEFAULT_REGION: 'ap-east-1'
  BILLING_REGION: us-east-1
  # The stage switch must stay repository-scoped: job-level `if` expressions are
  # evaluated before any environment exists, so an environment-scoped value would
  # never open the gate.
  ENABLE_BETA_MUTATION: ${{ vars.ENABLE_BETA_MUTATION }}
  INFRA_OPERATION: ${{ inputs.operation }}
  TESTER_EMAILS: '[]'
  INFRA_IDENTITY_PHASE: retired
  INFRA_RETENTION_PROTECTION: 'true'
  GH_TELEMETRY: disabled
jobs:
  # No credentials: reject a forbidden operation before the state job can request
  # an environment or an OIDC identity.
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Validate operation family and reviewed inputs
        run: node scripts/check-operation.mjs
  # Read-only state works with the stage switch closed: it runs no task, changes
  # nothing and publishes no evidence artifact. #207 retired the `observe`
  # operation with the record it produced; `state` is the read-only entry.
  state:
    needs: preflight
    if: github.ref == 'refs/heads/main' && inputs.operation == 'state'
    environment: beta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    # The runtime role ARN is an environment-scoped repository variable, so it
    # resolves only in a job that declares `beta`. Nothing before it reads it.
    env:
      INFRA_RUNTIME_ROLE_ARN: ${{ vars.INFRA_RUNTIME_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/deploy-operation
        with:
          verify_artifact: 'false'
