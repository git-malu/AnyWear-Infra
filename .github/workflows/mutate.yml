name: Beta infrastructure mutation
run-name: Beta ${{ inputs.operation }} at ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [deploy-foundation, deploy-billing, deploy-platform, deploy-egress, delete-egress, restore-release, migrate, admission-status, add-testers, set-testers, open-admission, close-admission]
        required: true
      service_release_tag:
        description: Sealed Service release tag; required by deploy-platform and restore-release only
        type: string
        default: ''
      service_commit:
        description: Service source commit the sealed release was built from; required with the tag
        type: string
        default: ''
      identity_phase:
        description: Identity phase; only deploy-* and restore-release may vary it
        type: choice
        options: [retired, roles-added, legacy]
        default: retired
        required: true
      retention_protection:
        description: Retention protection; only deploy-* and restore-release may vary it
        type: boolean
        default: true
        required: true
      tester_emails:
        description: Explicit email JSON array for add-testers or set-testers; otherwise []
        type: string
        default: '[]'
      nat_eip_allocation_id:
        description: Retained Egress EIP allocation for a deploy-egress start (eipalloc-...); empty creates a new EIP
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: anywear-infra-runtime
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Single-account constants, not environment configuration: `vars` resolves at
  # repository scope here, and the credential-free `preflight`/`verify` jobs have
  # no `environment:` to resolve environment-scoped variables from. The scripts and
  # validators already hard-code the same account and region.
  AWS_ACCOUNT_ID: '650880818323'
  AWS_REGION: 'ap-east-1'
  CDK_DEFAULT_ACCOUNT: '650880818323'
  CDK_DEFAULT_REGION: 'ap-east-1'
  BILLING_REGION: us-east-1
  # The stage switch must stay repository-scoped: job-level `if` expressions are
  # evaluated before any environment exists, so an environment-scoped value would
  # never open the gate.
  ENABLE_BETA_MUTATION: ${{ vars.ENABLE_BETA_MUTATION }}
  INFRA_OPERATION: ${{ inputs.operation }}
  SERVICE_RELEASE_TAG: ${{ inputs.service_release_tag }}
  SERVICE_COMMIT: ${{ inputs.service_commit }}
  TESTER_EMAILS: ${{ inputs.tester_emails }}
  NAT_EIP_ALLOCATION_ID: ${{ inputs.nat_eip_allocation_id }}
  INFRA_IDENTITY_PHASE: ${{ inputs.identity_phase }}
  INFRA_RETENTION_PROTECTION: ${{ inputs.retention_protection }}
  GH_TELEMETRY: disabled
jobs:
  # Reject a forbidden operation, a missing or unexpected Service release identity
  # and unreviewed context before any job holds a token, an environment or an OIDC
  # identity.
  preflight:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_BETA_MUTATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Validate operation family and reviewed Service release identity
        run: |
          mkdir -p deployment-evidence
          node scripts/check-operation.mjs
  # The only job that reads the sealed Service release. It holds a read-only App
  # token (only when the operation takes a release) and never an OIDC identity or
  # an environment.
  verify:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/verify-operation
        with:
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
  # The only job that acquires AWS credentials. It is scheduled after `verify`
  # and binds the downloaded verified-inputs artifact to this dispatch before the
  # restricted session is requested.
  deploy:
    needs: verify
    environment: beta
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    # The role ARNs are environment-scoped repository variables, so they resolve
    # only in this job, the one that declares `beta`. Nothing before it reads them.
    env:
      INFRA_DEPLOY_ROLE_ARN: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
      INFRA_RUNTIME_ROLE_ARN: ${{ vars.INFRA_RUNTIME_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download verified inputs and the sealed release directory
        uses: actions/download-artifact@v4
        with:
          name: infra-verified-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - uses: ./.github/actions/deploy-operation
  # No environment, no OIDC, no write permission: validate and checksum exactly
  # what the credential job produced.
  record:
    needs: deploy
    if: always() && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEPLOY_JOB_RESULT: ${{ needs.deploy.result }}
      REQUIRE_DEPLOYMENT_RECORD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Download the operation evidence
        uses: actions/download-artifact@v4
        with:
          name: infra-operation-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-evidence
      - name: Download the deployment record when the operation produced one
        uses: actions/download-artifact@v4
        with:
          name: infra-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-evidence
        continue-on-error: true
      - name: Download the observed authorization surface when the credential job produced one
        uses: actions/download-artifact@v4
        with:
          name: infra-permissions-observed-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-evidence
        continue-on-error: true
      - name: Validate, checksum and preserve the operation and deployment records
        run: node scripts/record-deployment.mjs
      - name: Fail on an observed action the declared authorization surface does not contain
        run: node scripts/check-authorization-observed.mjs
      - name: Preserve the validated records and their checksums
        uses: actions/upload-artifact@v4
        with:
          name: infra-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deployment-evidence/deployment-record.json
            deployment-evidence/deployment-record.json.sha256
            deployment-evidence/operation-record.json
            deployment-evidence/operation-record.json.sha256
          retention-days: 90
          if-no-files-found: error
