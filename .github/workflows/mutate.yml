name: Beta infrastructure mutation
run-name: Beta ${{ inputs.operation }} at ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [deploy-foundation, deploy-billing, deploy-platform, deploy-egress, delete-egress, deploy-runtime, stop-runtime, restore-release, migrate, admission-status, add-testers, set-testers]
        required: true
      service_release_tag:
        description: Sealed Service release tag; required by deploy-platform, deploy-runtime and restore-release only
        type: string
        default: ''
      service_commit:
        description: Service source commit the sealed release was built from; required with the tag
        type: string
        default: ''
      identity_phase:
        description: Identity phase; only deploy-* and restore-release may vary it (deploy-runtime/stop-runtime require roles-added)
        type: choice
        options: [retired, roles-added, legacy]
        default: retired
        required: true
      retention_protection:
        description: Retention protection; only deploy-* and restore-release may vary it
        type: boolean
        default: true
        required: true
      tester_emails:
        description: Explicit email JSON array for add-testers or set-testers; otherwise []
        type: string
        default: '[]'
      nat_eip_allocation_id:
        description: Retained Egress EIP allocation for a deploy-egress start (eipalloc-...); empty creates a new EIP
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: anywear-infra-runtime
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Single-account constants, not environment configuration: `vars` resolves at
  # repository scope here, and the credential-free `preflight`/`verify` jobs have
  # no `environment:` to resolve environment-scoped variables from. The scripts and
  # validators already hard-code the same account and region.
  AWS_ACCOUNT_ID: '650880818323'
  AWS_REGION: 'ap-east-1'
  CDK_DEFAULT_ACCOUNT: '650880818323'
  CDK_DEFAULT_REGION: 'ap-east-1'
  BILLING_REGION: us-east-1
  # The stage switch must stay repository-scoped: job-level `if` expressions are
  # evaluated before any environment exists, so an environment-scoped value would
  # never open the gate.
  ENABLE_BETA_MUTATION: ${{ vars.ENABLE_BETA_MUTATION }}
  INFRA_OPERATION: ${{ inputs.operation }}
  SERVICE_RELEASE_TAG: ${{ inputs.service_release_tag }}
  SERVICE_COMMIT: ${{ inputs.service_commit }}
  TESTER_EMAILS: ${{ inputs.tester_emails }}
  NAT_EIP_ALLOCATION_ID: ${{ inputs.nat_eip_allocation_id }}
  INFRA_IDENTITY_PHASE: ${{ inputs.identity_phase }}
  INFRA_RETENTION_PROTECTION: ${{ inputs.retention_protection }}
  GH_TELEMETRY: disabled
jobs:
  # Reject a forbidden operation, a missing or unexpected Service release identity
  # and unreviewed context before any job holds a token, an environment or an OIDC
  # identity.
  preflight:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_BETA_MUTATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Validate operation family and reviewed Service release identity
        run: node scripts/check-operation.mjs
  # The only job that reads the Service release. It proves the release and its tag
  # ref over the REST API, requires the asset names this operation consumes to be
  # present, uploaded and digest-valid, and downloads only those. It holds a
  # read-only App token (only when the operation takes a release) and never an OIDC
  # identity or an environment. It publishes the release BYTES as the transport
  # artifact and the PUBLISHED DIGESTS as this job's `release_assets` output; the
  # deploy job proves both before it requests a credential.
  verify:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      release_assets: ${{ steps.verify.outputs.release_assets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/verify-operation
        id: verify
        with:
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
  # The only job that acquires AWS credentials. It is scheduled after `verify` and
  # its first step proves the travelled release bytes against the published digests
  # and strictly loads the schema asset or runtime policy; only then does
  # `runtime-operation.mjs` request the restricted session. A failed or partial
  # mutation leaves a non-success run with no gate step using `continue-on-error`,
  # and a mutation that landed before a later refusal appends one summary line
  # naming the stack it already changed.
  deploy:
    needs: verify
    environment: beta
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    # The role ARNs are environment-scoped repository variables, so they resolve
    # only in this job, the one that declares `beta`. Nothing before it reads them.
    # `VERIFIED_RELEASE_ASSETS` is the verify job's output: the published digest of
    # each asset this operation consumes, and nothing else.
    env:
      INFRA_DEPLOY_ROLE_ARN: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
      INFRA_RUNTIME_ROLE_ARN: ${{ vars.INFRA_RUNTIME_ROLE_ARN }}
      VERIFIED_RELEASE_ASSETS: ${{ needs.verify.outputs.release_assets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the Service release bytes that travelled from verify
        if: env.INFRA_OPERATION == 'deploy-platform' || env.INFRA_OPERATION == 'restore-release' || env.INFRA_OPERATION == 'deploy-runtime'
        uses: actions/download-artifact@v4
        with:
          name: service-release-bytes-${{ github.run_id }}-${{ github.run_attempt }}
          # The upload has a single search path (`.service-artifacts/selected`), so
          # `upload-artifact` uses that directory itself as the artifact root and
          # stores the files at the artifact root. The download must therefore
          # target the same directory, or the bytes would land in the workspace
          # root and `prove-release-bytes.mjs` would fail closed on every release.
          path: .service-artifacts/selected
      - uses: ./.github/actions/deploy-operation
