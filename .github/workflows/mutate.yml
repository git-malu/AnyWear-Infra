name: Beta infrastructure mutation
run-name: Beta ${{ inputs.operation }} at ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [deploy-foundation, deploy-billing, deploy-platform, deploy-workload, restore-release, migrate, admission-status, add-testers, set-testers, suspend-admission, resume-admission]
        required: true
      selection_file:
        description: Committed canonical selection in this Infra revision
        default: selections/beta-baseline.json
        type: string
        required: true
      selection_sha256:
        description: Exact raw hash of the committed selection
        type: string
        required: true
      stack_sources_file:
        description: Reviewed per-stack producer source JSON path
        type: string
        required: true
      stack_sources_sha256:
        description: Exact raw hash of the reviewed stack source file
        type: string
        required: true
      identity_phase:
        description: Identity phase; only deploy-* and restore-release may vary it
        type: choice
        options: [retired, roles-added, legacy]
        default: retired
        required: true
      retention_protection:
        description: Retention protection; only deploy-* and restore-release may vary it
        type: boolean
        default: true
        required: true
      beta_api_sizing_profile:
        description: Retain sizing or explicitly select S1/S2 on active Beta; only deploy-workload may change it
        type: choice
        options: [preserve, s1, s2-api]
        default: preserve
        required: true
      beta_sizing_telemetry:
        description: Retain telemetry or explicitly enable/disable on active Beta; only deploy-workload may change it
        type: choice
        options: [preserve, enable, disable]
        default: preserve
        required: true
      tester_emails:
        description: Explicit email JSON array for add-testers or set-testers; otherwise []
        type: string
        default: '[]'
      window_minutes:
        description: Admission window bound in minutes, 15-240; used only by resume-admission
        type: number
        default: 60
permissions:
  contents: read
concurrency:
  group: anywear-infra-runtime
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Single-account constants, not environment configuration: `vars` resolves at
  # repository scope here, and the credential-free `preflight`/`verify` jobs have
  # no `environment:` to resolve environment-scoped variables from. The scripts and
  # validators already hard-code the same account and region.
  AWS_ACCOUNT_ID: '650880818323'
  AWS_REGION: 'ap-east-1'
  CDK_DEFAULT_ACCOUNT: '650880818323'
  CDK_DEFAULT_REGION: 'ap-east-1'
  BILLING_REGION: us-east-1
  # The stage switch must stay repository-scoped: job-level `if` expressions are
  # evaluated before any environment exists, so an environment-scoped value would
  # never open the gate.
  ENABLE_BETA_MUTATION: ${{ vars.ENABLE_BETA_MUTATION }}
  INFRA_OPERATION: ${{ inputs.operation }}
  TESTER_EMAILS: ${{ inputs.tester_emails }}
  WINDOW_MINUTES: ${{ inputs.window_minutes }}
  INFRA_IDENTITY_PHASE: ${{ inputs.identity_phase }}
  INFRA_RETENTION_PROTECTION: ${{ inputs.retention_protection }}
  SELECTION_FILE: ${{ inputs.selection_file }}
  SELECTION_SHA256: ${{ inputs.selection_sha256 }}
  STACK_SOURCES_FILE: ${{ inputs.stack_sources_file }}
  STACK_SOURCES_SHA256: ${{ inputs.stack_sources_sha256 }}
  GH_TELEMETRY: disabled
jobs:
  # Reject a forbidden operation, a stale committed selection or unreviewed stack
  # provenance before any job holds a token, an environment or an OIDC identity.
  preflight:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_BETA_MUTATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Validate operation family, committed source and stack provenance
        run: |
          mkdir -p deployment-evidence
          node scripts/check-operation.mjs
          node scripts/check-stack-sources.mjs
      - name: Check native release verification CLI capability
        run: |
          gh release verify --format json --help > /dev/null
          gh release verify-asset --format json --help > /dev/null
  # The only job that reads immutable Service inputs. It holds a read-only App
  # token and never an OIDC identity or an environment.
  verify:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/verify-operation
        with:
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          beta_api_sizing_profile: ${{ inputs.beta_api_sizing_profile }}
          beta_sizing_telemetry: ${{ inputs.beta_sizing_telemetry }}
  # The only job that acquires AWS credentials. It is scheduled after `verify`
  # and binds the downloaded verified-inputs artifact to this dispatch before the
  # restricted session is requested.
  deploy:
    needs: verify
    environment: beta
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    # The role ARNs are environment-scoped repository variables, so they resolve
    # only in this job, the one that declares `beta`. Nothing before it reads them.
    env:
      INFRA_DEPLOY_ROLE_ARN: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
      INFRA_RUNTIME_ROLE_ARN: ${{ vars.INFRA_RUNTIME_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download verified inputs and verified artifact directory
        uses: actions/download-artifact@v4
        with:
          name: infra-verified-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - uses: ./.github/actions/deploy-operation
        with:
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          beta_api_sizing_profile: ${{ inputs.beta_api_sizing_profile }}
          beta_sizing_telemetry: ${{ inputs.beta_sizing_telemetry }}
  # No environment, no OIDC, no write permission: validate and checksum exactly
  # what the credential job produced.
  record:
    needs: deploy
    if: always() && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEPLOY_JOB_RESULT: ${{ needs.deploy.result }}
      REQUIRE_DEPLOYMENT_RECORD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download the operation evidence
        uses: actions/download-artifact@v4
        with:
          name: infra-operation-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-evidence
      - name: Download the deployment record when the operation produced one
        uses: actions/download-artifact@v4
        with:
          name: infra-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-evidence
        continue-on-error: true
      - name: Validate, checksum and preserve the operation and deployment records
        run: node scripts/record-deployment.mjs
      - name: Preserve the validated records and their checksums
        uses: actions/upload-artifact@v4
        with:
          name: infra-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deployment-evidence/deployment-record.json
            deployment-evidence/deployment-record.json.sha256
            deployment-evidence/operation-record.json
            deployment-evidence/operation-record.json.sha256
          retention-days: 90
          if-no-files-found: error
