name: Future qualified Production promotion
on:
  # Not an entry: this file stays source-disabled and is callable only. Its
  # tested pre-AWS blocker and tests remain; a future reviewed onboarding adds the
  # dispatch surface together with the Production role and verifier contract.
  workflow_call:
permissions:
  contents: read
concurrency:
  group: anywear-infra-runtime
  cancel-in-progress: false
jobs:
  promotion:
    # #54 does not enable this gate, install the Production role or mutate Prod.
    if: github.ref == 'refs/heads/main'
    # No `environment:` here: this repository has no registered `prod`
    # environment, so naming one would let the first dispatch materialise an
    # unprotected one. A future reviewed onboarding restores the environment
    # protection together with removing the source blocker.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      PROD_DEPLOY_ROLE_ARN: ${{ vars.PROD_DEPLOY_ROLE_ARN }}
      QUALIFICATION_RUN_ID: ${{ vars.PROD_QUALIFICATION_RUN_ID }}
      QUALIFICATION_RUN_ATTEMPT: ${{ vars.PROD_QUALIFICATION_RUN_ATTEMPT }}
      QUALIFICATION_ARTIFACT_ID: ${{ vars.PROD_QUALIFICATION_ARTIFACT_ID }}
      QUALIFICATION_RECORD_SHA256: ${{ vars.PROD_QUALIFICATION_RECORD_SHA256 }}
      QUALIFICATION_E2E_SHA: ${{ vars.PROD_QUALIFICATION_E2E_SHA }}
      STABLE_RELEASE_ID: ${{ vars.PROD_STABLE_RELEASE_ID }}
      SERVICE_RELEASE_ID: ${{ vars.PROD_SERVICE_RELEASE_ID }}
      SERVICE_SOURCE_SHA: ${{ vars.PROD_SERVICE_SOURCE_SHA }}
      SERVICE_IMAGE_DIGEST: ${{ vars.PROD_SERVICE_IMAGE_DIGEST }}
      GH_TELEMETRY: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require separately reviewed Production executor onboarding before credentials or artifact access
        run: node scripts/promote-production.mjs
      - run: npm ci
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: 3346940
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: git-malu
          repositories: |
            AnyWear-Service
            AnyWear-E2E
          permission-contents: read
          permission-actions: read
          permission-attestations: read
      - name: Verify the reviewed release identity, stable release and trusted Beta qualification before AWS credentials
        id: qualified
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/production-preflight.mjs resolve
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ vars.PROD_QUALIFICATION_ARTIFACT_ID }}
          repository: git-malu/AnyWear-E2E
          run-id: ${{ vars.PROD_QUALIFICATION_RUN_ID }}
          github-token: ${{ steps.app.outputs.token }}
          path: .qualification/download
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          repository: git-malu/AnyWear-E2E
          ref: ${{ steps.qualified.outputs.e2e_sha }}
          path: .qualification-verifier
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - name: Verify the qualification record v3 integrity and exact artifact/run/attempt/release binding
        run: node scripts/production-preflight.mjs verify
      # Execution stays source-disabled in scripts/promote-production.mjs, which
      # runs before credentials and cannot be bypassed by an activation variable.
      # The preflight consumes the flat v3 record (`revisions`/`service_artifacts`/
      # `observations`); it no longer downloads or validates deployment records.
      # A future reviewed onboarding PR must supply scoped cross-account credentials,
      # Production DB observation, scan/retention evidence and compute-only recovery.
