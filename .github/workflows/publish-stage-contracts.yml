name: Publish stage contracts

# Tag-driven publication for the versioned constructs package. This workflow is
# the only registry writer: it holds `packages: write` and no AWS credential, and
# no deploy job consumes a registry credential. Pushing the annotated
# `stage-contracts-v<version>` tag publishes exactly that package version.

on:
  push:
    tags:
      - 'stage-contracts-v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/stage-contracts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Assert the tag matches the package version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          expected="stage-contracts-v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match ${expected}"
            exit 1
          fi
          echo "Publishing @git-malu/stage-contracts ${version} from ${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm test
      - name: Publish to GitHub Packages
        run: npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
