name: Beta stack deployment and recovery
run-name: Beta ${{ inputs.operation }} at ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [deploy-foundation, deploy-billing, deploy-platform, deploy-workload, restore-release]
        required: true
      selection_file:
        description: Committed canonical selection in this Infra revision
        default: selections/beta-baseline.json
        type: string
        required: true
      selection_sha256:
        description: Exact raw hash of the committed selection
        type: string
        required: true
      stack_sources_file:
        description: Reviewed per-stack producer source JSON path
        type: string
        required: true
      stack_sources_sha256:
        description: Exact raw hash of the reviewed stack source file
        type: string
        required: true
      identity_phase:
        type: choice
        options: [retired, roles-added, legacy]
        required: true
      retention_protection:
        type: boolean
        required: true
      beta_api_sizing_profile:
        description: Retain sizing or explicitly select S1/S2 on active Beta with the same Service image
        type: choice
        options: [preserve, s1, s2-api]
        default: preserve
        required: true
      beta_sizing_telemetry:
        description: Retain telemetry or explicitly enable/disable on active Beta with the same Service image
        type: choice
        options: [preserve, enable, disable]
        default: preserve
        required: true
permissions:
  contents: read
concurrency:
  group: anywear-infra-runtime
  cancel-in-progress: false
jobs:
  operation:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_BETA_DEPLOY == 'true'
    environment: beta
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      BILLING_REGION: us-east-1
      ENABLE_BETA_DEPLOY: ${{ vars.ENABLE_BETA_DEPLOY }}
      INFRA_OPERATION: ${{ inputs.operation }}
      TESTER_EMAILS: '[]'
      INFRA_IDENTITY_PHASE: ${{ inputs.identity_phase }}
      INFRA_RETENTION_PROTECTION: ${{ inputs.retention_protection }}
      INFRA_DEPLOY_ROLE_ARN: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
      INFRA_RUNTIME_ROLE_ARN: ${{ vars.INFRA_RUNTIME_ROLE_ARN }}
      SELECTION_FILE: ${{ inputs.selection_file }}
      SELECTION_SHA256: ${{ inputs.selection_sha256 }}
      STACK_SOURCES_FILE: ${{ inputs.stack_sources_file }}
      STACK_SOURCES_SHA256: ${{ inputs.stack_sources_sha256 }}
      GH_TELEMETRY: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/beta-operation
        with:
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          beta_api_sizing_profile: ${{ inputs.beta_api_sizing_profile }}
          beta_sizing_telemetry: ${{ inputs.beta_sizing_telemetry }}
