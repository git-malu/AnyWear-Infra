name: Infra source checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run check
      - name: Reproduce and confine CLI 2.101.0 state without credentials or network
        id: cli_state
        env:
          CLI_REGRESSION_DIRECTORY: ${{ runner.temp }}/offline-cli-state
        run: |
          mkdir -p "$CLI_REGRESSION_DIRECTORY"
          result="$CLI_REGRESSION_DIRECTORY/result.json"
          printf '%s\n' '{"schema_version":1,"record_type":"anywear_offline_cli_state_regression","cli_version":"2.101.0","network_isolated":false,"credentials_supplied":false,"native_reads_performed":false,"passed":false,"trials":[]}' > "$result"
          archive="$CLI_REGRESSION_DIRECTORY/gh_2.101.0_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error https://github.com/cli/cli/releases/download/v2.101.0/gh_2.101.0_linux_amd64.tar.gz --output "$archive"
          printf '%s  %s\n' '9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$CLI_REGRESSION_DIRECTORY"
          sudo -n unshare --net -- /usr/bin/env -i PATH="$PATH" LANG=C.UTF-8 \
            HANDSHAKE_REQUIRE_LINUX_CLI_REGRESSION=true \
            HANDSHAKE_CLI_EXECUTABLE="$CLI_REGRESSION_DIRECTORY/gh_2.101.0_linux_amd64/bin/gh" \
            HANDSHAKE_CLI_REGRESSION_RESULT="$result" \
            "$(command -v node)" --test --test-name-pattern 'credential-free Linux CLI state regression' scripts/publication-handshake.test.mjs
      - name: Preserve sanitized CLI state observations on success or failure
        if: ${{ always() && steps.cli_state.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: offline-cli-state-regression
          path: ${{ runner.temp }}/offline-cli-state/result.json
          if-no-files-found: error
      - name: Check native release verification CLI offline
        run: |
          gh --version
          gh release verify --format json --help > /dev/null
          gh release verify-asset --format json --help > /dev/null
      - run: bash -n .github/scripts/run-one-shot-task.sh .github/scripts/writer-window-hook.sh
      - name: Compare explicit live Foundation with authenticated Original fixture
        env:
          AWS_REGION: ap-east-1
          AWS_DEFAULT_REGION: ap-east-1
          CDK_DEFAULT_ACCOUNT: '650880818323'
          CDK_DEFAULT_REGION: ap-east-1
          BILLING_REGION: us-east-1
        run: |
          npx cdk synth AnyWearFoundationStack --lookups false --output cdk.live-foundation -c appScope=foundation -c identityPhase=roles-added -c legacyRoleOwnership=external --quiet
          node scripts/compare-live-foundation.mjs --candidate cdk.live-foundation/AnyWearFoundationStack.template.json --output cdk.live-foundation/comparison.json
      - name: Synthesize identity and runtime matrix from fixture artifacts
        run: |
          node scripts/create-test-inputs.mjs
          node scripts/synth-matrix.mjs --artifact-directory .service-artifacts/test --baseline-templates test/baselines --output cdk.matrix
          node scripts/synth-matrix.mjs --artifact-directory .service-artifacts/test --baseline-templates test/baselines --retention-protection true --output cdk.protected.matrix
      - uses: actions/upload-artifact@v4
        with:
          name: infra-source-matrix
          path: |
            cdk.matrix/comparison.json
            cdk.protected.matrix/comparison.json
            cdk.live-foundation/comparison.json
            cdk.live-foundation/AnyWearFoundationStack.template.json
          if-no-files-found: error
